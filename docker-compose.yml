version: '3'
services:
    digipatrol:
        build:
            dockerfile: Dockerfile
        image: base-php8
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - '.:/var/www/html'
        networks:
            - nginx-proxy-manager_default
