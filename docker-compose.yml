version: '3'
services:
    digipatrol:
        build:
            context: ./docker/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.2/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:sail}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        command:
              - /bin/bash
              - -c
              - |
              composer install
              npm install
              npm run dev
        volumes:
            - '.:/var/www/html'
        networks:
            - digipatrol-network
networks:
    digipatrol-network:
        name: nginx-proxy-manager_default
        external: true